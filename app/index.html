<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<title>Catalog</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="color:#fff;padding:24px">This catalog needs JavaScript.</p></noscript>
<script type="module">
  import { App } from './src/ui/app.js';

  const app = new App(document.getElementById('app'));
  window.app = app; // one handle for the console; nothing depends on it
  app.boot().catch((error) => {
    document.getElementById('app').innerHTML =
      `<pre style="color:#ff8080;padding:24px;white-space:pre-wrap">Could not start:\n${error.stack ?? error}</pre>`;
  });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
